<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Реєстрація</h2>

<form action="#" method="post">

    <label for="username">Username</label><br>
    <input type="text" id="username" name="username" placeholder="Введіть ім’я користувача"><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" placeholder="example@mail.com"><br><br>

    <label for="password">Password</label><br>
    <input type="password" id="password" name="password" placeholder="Введіть пароль"><br><br>

    <label for="repeat_password">Repeat Password</label><br>
    <input type="password" id="repeat_password" name="repeat_password" placeholder="Повторіть пароль"><br><br>

    <button type="submit">Зареєструватися</button>
    <button type="reset">Скинути</button>

</form>

</body>
</html>
